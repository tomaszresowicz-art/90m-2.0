<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Terminarz</title>
    <style>
        body { font-family: sans-serif; padding: 10px; }
        .mecz { border: 1px solid #ccc; padding: 5px; margin: 5px 0; border-radius: 4px; }
        /* Styl tylko dla wyróżnionych drużyn */
        .highlight { border: 2px solid black !important; font-weight: bold; background-color: #f9f9f9; }
    </style>
</head>
<body>

    <button onclick="pobierz(5)">Małopolski ZPN</button>
    <div id="wyniki"></div>

    <script>
        async function pobierz(id) {
            document.getElementById("wyniki").innerHTML = "Cierpliwości...";
            const res = await fetch('/pobierz?id=' + id);
            const dane = await res.json();
            const kontener = document.getElementById("wyniki");
            kontener.innerHTML = "";

            dane.forEach(mecz => {
                const druzyny = ["Wisła Kraków", "Garbarnia Kraków", "Puszcza Niepołomice"];
                const jestWyr = druzyny.some(d => mecz.mecz.includes(d));
                
                const div = document.createElement("div");
                div.className = "mecz" + (jestWyr ? " highlight" : "");
                div.innerHTML = (jestWyr ? "⚽ " : "") + mecz.data_label + " " + mecz.godzina + " - " + mecz.mecz;
                kontener.appendChild(div);
            });
        }
    </script>
</body>
</html>
